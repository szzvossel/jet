[package]
name = "jet-client"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "jet-client"
path = "src/main.rs"

[dependencies]
jet-core = { path = "../core" }
jet-bus = { path = "../bus" }

tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
tungstenite = "0.28"
