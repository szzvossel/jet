[package]
name = "jet-tracer"
version = "0.1.0"
description = "Centralized log monitoring, parsing, and metric dashboard"
edition = "2021"
rust-version = "1.77.2"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
notify = "7"
thiserror = "2"
