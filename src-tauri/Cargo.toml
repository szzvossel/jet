[package]
name = "jet"
version = "0.1.0"
description = "Equity derivatives quantitative analysis desktop application"
authors = ["you"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "jet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Mathematics & Statistics
statrs = "0.18"

# Error handling
thiserror = "2"
