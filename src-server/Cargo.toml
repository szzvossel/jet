[package]
name = "jet-server"
version = "0.1.0"
description = "HTTP API server for JET pricing engine"
edition = "2021"
rust-version = "1.77.2"

[dependencies]
jet-core = { path = "../crates/core" }
jet-tracer = { path = "../crates/tracer" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
